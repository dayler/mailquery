name: tests

on:
  # Runs only on pull requests to main and develop; pushes do not trigger it.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to the PR branch cancels the previous run instead of queuing it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install css-inline
        run: python -m pip install "css-inline~=0.23.1"
      - name: Install coverage
        run: python -m pip install "coverage~=7.17"
      - name: Install pywin32 (Windows only)
        if: runner.os == 'Windows'
        run: python -m pip install pywin32
      - name: Run unit, contract, integration and read-only tests
        # tests/test_readonly.py is blocking: it fails if any store file
        # changes or if the tool writes outside ~/.mailquery. The suite runs
        # under coverage so the next step can gate the total.
        run: python -B -m coverage run -m unittest discover -s tests -t . -v
      - name: Check coverage
        # Fails (exit 2) below the 85 % combined line and branch threshold.
        run: python -m coverage report

  install-scripts:
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: sh
          - os: macos-latest
            kind: sh
          - os: windows-latest
            kind: ps1
    steps:
      - uses: actions/checkout@v4

      - name: Check css-inline wheels
        # Every supported platform must have a prebuilt wheel of the allowed
        # patch range, so installing never compiles it and never reaches 0.24.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          for platform in macosx_11_0_arm64 macosx_10_12_x86_64 win_amd64 win32 manylinux_2_17_x86_64; do
            dest="$RUNNER_TEMP/css-inline-$platform"
            python3 -m pip download "css-inline~=0.23.1" --only-binary=:all: --no-deps \
              --platform "$platform" --python-version 3.11 --implementation cp --dest "$dest"
            ls "$dest" | grep -E '^css_inline-0\.23\.[0-9]+-.+\.whl$'
          done

      - name: Validate and dry-run scripts/install.sh
        if: matrix.kind == 'sh'
        shell: bash
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help
          sh scripts/install.sh --print-config > /dev/null
          sh scripts/install.sh --dry-run --no-config
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error scripts/install.sh
          fi

      - name: Install shellcheck
        if: matrix.kind == 'sh'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Check shellcheck
        if: matrix.kind == 'sh'
        shell: bash
        run: shellcheck --severity=error scripts/install.sh

      - name: Validate and dry-run skills/install.sh
        if: matrix.kind == 'sh'
        shell: bash
        run: |
          sh -n skills/install.sh
          sh skills/install.sh --help > /dev/null
          sh skills/install.sh --dry-run --harness dsh --scope project
          sh skills/install.sh --dry-run --path "$RUNNER_TEMP/mq-skills-test"
          shellcheck --severity=error skills/install.sh

      - name: Validate and dry-run scripts/install.ps1
        if: matrix.kind == 'ps1'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          ./scripts/install.ps1 -DryRun -NoConfig
          ./scripts/install.ps1 -PrintConfig > $null

      - name: Validate and dry-run skills/install.ps1
        if: matrix.kind == 'ps1'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "skills/install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          ./skills/install.ps1 -Help | Out-Null
          ./skills/install.ps1 -Path "$env:TEMP\mq-skills-test" -DryRun

