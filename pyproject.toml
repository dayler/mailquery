[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailquery"
version = "3.0.0a0"
description = "Read-only CLI to read and search Apple Mail on macOS and classic Outlook on Windows from an agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ariel Dayler Salzar Hinojosa" }]
keywords = ["apple-mail", "outlook", "cli", "read-only", "sqlite", "emlx"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Utilities",
]
dependencies = ["css-inline~=0.23.1", "pywin32; sys_platform == \"win32\""]

[project.scripts]
mailquery = "mailquery.cli:main"

# Backend driver registry. External plugins register in the
# same group; the registry also has a static fallback for development/CI.
[project.entry-points."mailquery.backends"]
apple_mail = "mailquery.backends.apple_mail:AppleMailBackend"
outlook = "mailquery.backends.outlook:OutlookBackend"

[project.urls]
Homepage = "https://github.com/dayler/mailquery"
Repository = "https://github.com/dayler/mailquery"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# Measure line and branch coverage of the package only.
branch = true
source = ["src/mailquery"]
relative_files = true

[tool.coverage.report]
# The report fails below 85 % combined line and branch coverage.
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
