# ============================================================================
# mailquery — configuración de ejemplo (v1)
#
# Este archivo lo copian los instaladores (`scripts/install.sh` o
# `scripts/install.ps1`) a `~/.mailquery/config.toml` si ese archivo no
# existe todavía. La aplicación nunca crea ni modifica la configuración:
# solo este instalador la siembra, y solo si falta.
#
# Una cuenta SOLO se lee si la declaras con un bloque [scope."<cuenta>"].
# Identifícala con la etiqueta que muestra `mailquery mailboxes` (también
# sirve su email si es único, o el UUID/prefijo de al menos 8 caracteres).
# Dentro de cada cuenta declarada, INBOX se incluye siempre; `mailbox_list`
# solo añade carpetas extra.
#
# Tras editarlo, valida con:  mailquery doctor && mailquery mailboxes
# ============================================================================

# --- Valores globales (todos opcionales; estos son los defaults) ------------
# [logging]
# level = "info"                 # error | warning | info | debug
# retention_days = 7             # 1..365

# [search]
# default_limit = 20             # 1..200
# max_scan = 5000                # 100..50000

# [new]
# default_limit = 100            # 1..500
# lookback = "10min"             # 1min..1d

# --- Cuentas observadas (descomenta y ajusta a tus cuentas) -----------------
# [scope."iCloud (tu@email.com)"]
# mailbox_list = ["Facturas", "Archivo"]

# [scope."Gmail (tu@gmail.com)"]
# mailbox_list = ["[Gmail]/Important"]

# [scope."On My Device"]
