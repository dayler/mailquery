# ============================================================================
# mailquery — example configuration (version 2.0.1; features for the future,
# not-yet-released 3.0.0 of PRD-v2.1, macOS and Windows)
#
# The installers (`scripts/install.sh` or `scripts/install.ps1`) copy this file
# to `~/.mailquery/config.toml` when that file does not exist yet. The
# application never creates or modifies the configuration: only the installer
# seeds it, and only when it is missing.
#
# An account is read ONLY if you declare it with a
# [scope."<driver>:<account>"] block; without the driver prefix the native
# driver of the OS is used (`apple_mail` on macOS, `outlook` on Windows).
# Identify the account with the label shown by `mailquery mailboxes` (its
# unique email, or the account UUID / a unique prefix of at least 8 characters,
# also work).
# Inside every declared account, INBOX is always included; `mailbox_list` only
# adds extra folders. Unknown keys => E_CONFIG_INVALID (exit 2).
#
# The `scope` namespace is required in the keys, but you do not need to write
# [scope] separately: [scope."..."] creates the parent table implicitly.
#
# Every machine has its own config.toml: only the accounts of that machine's
# backend resolve (an account from the other backend => E_CONFIG_ACCOUNT_UNKNOWN).
#
# After editing it, validate with:  mailquery doctor && mailquery mailboxes
# ============================================================================

# --- Global values (all optional; these are the defaults) -------------------
# [logging]
# level = "info"                 # error | warning | info | debug
# max_size_mb = 10               # 1..1024; rotates the log when it grows (5 kept)

# [search]
# default_limit = 20             # 1..200
# max_scan = 5000                # 100..50000

# [new]
# default_limit = 100            # 1..500
# lookback = "10min"             # 1min..1d

# --- Local attachment recovery (PRD-v2.1; future, not-yet-released 3.0.0) ---
# Limits of `mailquery attachment`; `show` is not affected by `enabled`.
# Recovered files go to ~/.mailquery/attachments/<driver>/<native_id>/ with
# directories 0700 and files 0600 on POSIX; the whole message is blocked when
# any attachment is dangerous.
# [attachments]
# enabled = true                 # true | false
# max_file_size_mb = 100         # 1..500
# max_total_size_mb = 200        # 1..1024 (>= max_file_size_mb)
# max_count = 50                 # 1..500

# --- Observed accounts: macOS (Apple Mail) ----------------------------------
# A block without a driver prefix uses the native driver of the OS
# (`apple_mail` on macOS, `outlook` on Windows). Write the prefix explicitly to
# pin a driver: [scope."<driver>:<account>"]. An account label that contains
# ":" must be declared with the explicit prefix, because the first ":" is the
# driver separator.
# Uncomment and adjust to your accounts.
# [scope."iCloud (you@email.com)"]
# mailbox_list = ["Invoices", "Archive"]

# [scope."Gmail (you@gmail.com)"]
# mailbox_list = ["[Gmail]/Important"]

# [scope."On My Device"]

# Explicit driver prefix (same account as the block above; the native driver
# can also be written explicitly). Two blocks that resolve to the same driver
# and account are merged.
# [scope."apple_mail:iCloud (you@email.com)"]
# mailbox_list = ["Invoices", "Archive"]

# --- Observed accounts: Windows (classic Outlook) ---------------------------
# Exchange account in cached mode: INBOX (the inbox, whatever the Outlook
# display language) + one subfolder of the inbox + one top-level folder.
# [scope."Exchange (you@company.com)"]
# mailbox_list = ["INBOX/Invoices", "Archive"]

# Second account of the profile, INBOX only.
# [scope."Exchange (other@company.com)"]

# PST data file on the local disk (it has no email: declare it by its label).
# [scope."PST (Archive 2025)"]
# mailbox_list = ["Projects/2025"]

# A declared account that resolves to an excluded store (shared mailbox,
# public folders, online mode, network path...) is not read and produces
# W_STORE_EXCLUDED with its reason; `mailquery mailboxes` lists them under
# `excluded_stores`.

# An installed backend plugin is declared with its own driver prefix and the
# label/uuid it exposes (opaque identifiers, resolved by the plugin):
# [scope."graph:trabajo@empresa.com"]
# mailbox_list = ["INBOX/Invoices"]

# ----------------------------------------------------------------------------
# Alternative ways to identify the SAME account (use ONE per block; if blocks
# repeat for the same account, their lists are merged):
#
#   [scope."you@gmail.com"]                           # by unique email
#   [scope."<account uuid>"]                          # by full UUID (`mailboxes` shows it)
#   [scope."<first 8+ chars of the uuid>"]            # by unique prefix (>= 8)
#
# Each mailbox_list item is a name, path or folder URL as shown by
# `mailquery mailboxes`. It must exist in that account; otherwise the command
# fails with E_MAILBOX_NOT_FOUND.
#
# `[attachments]` accepts only `enabled`, `max_file_size_mb`,
# `max_total_size_mb` and `max_count`; a value out of range (or a total lower
# than the per-file limit) fails with E_CONFIG_INVALID (exit 2).
# ----------------------------------------------------------------------------
